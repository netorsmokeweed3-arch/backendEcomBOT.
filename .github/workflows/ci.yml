name: OmniFlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Клонування репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Встановлення залежностей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Запуск інтеграційних тестів
      env:
        APP_ENCRYPTION_KEY: "K_4e9F8aBcD1234567890XyzWvuTsrQPoNmLkJhGFedc="
        JWT_SECRET_KEY: "test-jwt-secret-key-for-github-actions"
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        pytest -v