version: '3.8'

services:
  web:
    build: .
    container_name: ecom_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ecom_saas
      - REDIS_URL=redis://redis:6379/0
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-K_4e9F8aBcD1234567890XyzWvuTsrQPoNmLkJhGFedc=}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-netor-super-secure-jwt-secret-key-2026}
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: ecom_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecom_saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: always

volumes:
  postgres_data:
