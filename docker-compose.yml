version: '3.8'

services:
  web:
    build: .
    container_name: ecom_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?err}@db:5432/ecom_saas
      - REDIS_URL=redis://:${REDIS_PASSWORD:?err}@redis:6379/0
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?err}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?err}
      - ENVIRONMENT=production
      - AUTO_CREATE_TABLES=false
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: ecom_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ecom_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?err}

volumes:
  postgres_data: